name: Playgroundpediatrics
description: 'Playground Pediatrics is a pediatric medical group and practice-support (management
  services) organization that partners with independent, community-based pediatric practices across
  North Carolina, Georgia, Tennessee, and Pennsylvania. It provides partner practices with operational
  support (billing, payer contracting, HR, payroll, technology, compliance, and marketing), talent
  recruiting/development/retention, and infrastructure for long-term stability and value-based care
  participation, while letting each practice keep its local identity. Partner practices include Cobb
  Pediatrics, Cornerstone Medical Associates, and Rainbow Pediatrics. Backed by Norwest Venture
  Partners. No public API, developer portal, documentation, or event surface was found as of this
  enrichment pass.'
